<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography | AlexanderCarter.net</title>
  
  <meta name="description" content="Alex's galleries">
  <meta name="keywords" content="Photography, Art, Nightlife">
  
  <!-- Fonts and Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-primary: #080c14;
      --bg-secondary: rgba(15, 22, 38, 0.7);
      --bg-tertiary: rgba(22, 32, 56, 0.5);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-purple: #9b51e0;
      --accent-pink: #ff007f;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glass-blur: blur(16px);
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Background glow decorations */
    .glow-bg {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(130px);
      opacity: 0.15;
    }

    .glow-cyan {
      background: radial-gradient(circle, var(--accent-cyan) 0%, transparent 70%);
      top: -200px;
      left: -200px;
    }

    .glow-purple {
      background: radial-gradient(circle, var(--accent-purple) 0%, transparent 70%);
      bottom: -200px;
      right: -200px;
    }

    /* Container & Header */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 4rem;
      position: relative;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .logo-icon {
      font-size: 2.25rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.3));
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #ffffff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0.75rem auto 0 auto;
      font-weight: 300;
    }

    /* Main Section Layout */
    .gallery-section {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .gallery-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    @media (min-width: 768px) {
      .gallery-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .gallery-title-wrapper {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    .gallery-title {
      font-size: 1.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* custom select styling */
    .select-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .gallery-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background: rgba(15, 22, 38, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.5rem 2.25rem 0.5rem 1rem;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .gallery-select:focus, .gallery-select:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.15);
    }

    .select-chevron {
      position: absolute;
      right: 0.85rem;
      color: var(--text-muted);
      pointer-events: none;
      font-size: 0.75rem;
      transition: transform var(--transition-fast);
    }

    .gallery-select:focus + .select-chevron {
      transform: rotate(180deg);
      color: var(--accent-cyan);
    }

    /* Header Progress Indicators */
    .header-progress-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
      max-width: 320px;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
    }

    .header-progress-text {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      text-align: left;
    }

    @media (min-width: 768px) {
      .header-progress-text {
        text-align: right;
      }
    }

    .header-progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .header-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
      border-radius: 999px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    /* Media Cards */
    .media-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      transition: transform var(--transition-normal), border-color var(--transition-normal), box-shadow var(--transition-normal);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .media-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 242, 254, 0.2);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
    }

    .media-preview-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .media-preview {
t in the dark worked.
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .media-preview.loaded {
      opacity: 1;
    }

    /* Skeleton Loader */
    .skeleton {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid rgba(255, 255, 255, 0.05);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .skeleton-progress {
      font-size: 0.8rem;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }

    /* Card Details */
    .media-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .media-name {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    .media-size {
      font-family: 'JetBrains Mono', monospace;
    }

    .media-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.65rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .badge-image {
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 242, 254, 0.2);
    }

    .badge-video {
      color: var(--accent-pink);
      border: 1px solid rgba(255, 0, 127, 0.2);
    }

    /* Action Overlay on Card Preview */
    .media-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 12, 20, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      z-index: 2;
    }

    .media-preview-container:hover .media-overlay {
      opacity: 1;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast), border-color var(--transition-fast);
    }

    .icon-btn:hover {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #000;
      transform: scale(1.1);
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 12, 0.95);
      backdrop-filter: blur(20px);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast);
      z-index: 1001;
    }

    .lightbox-close:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .lightbox-media {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .lightbox-media.active {
      display: block;
    }

    .lightbox-title {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      font-weight: 500;
      color: white;
      text-align: center;
    }

    /* Video player specific styles */
    video.lightbox-media {
      width: 100%;
      aspect-ratio: 16/9;
      background: black;
      outline: none;
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      border: 2px dashed var(--border-color);
      border-radius: 24px;
      background: var(--bg-secondary);
      backdrop-filter: var(--glass-blur);
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .empty-state h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-muted);
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- Background decorative glows -->
  <div class="glow-bg glow-cyan"></div>
  <div class="glow-bg glow-purple"></div>

  <div class="container">
    <header>
      <div class="logo-container">
        <i class="fa-solid fa-circle-nodes logo-icon"></i>
      </div>
      <h1>Photography by Alexander Carter</h1>
    </header>

    <!-- Gallery Showcase -->
    <main class="gallery-section">
      <div class="gallery-header">
        <div class="gallery-title-wrapper">
          <h2 class="gallery-title">
            <i class="fa-solid fa-images" style="color: var(--accent-cyan);"></i> 
            <span id="gallery-title-text">Gallery</span>
          </h2>
          <div class="select-wrapper">
            <select id="gallery-select" class="gallery-select" aria-label="Select Gallery">
              <option value="">Loading galleries...</option>
            </select>
            <i class="fa-solid fa-chevron-down select-chevron"></i>
          </div>
        </div>
        
        <div class="gallery-actions" style="display:flex; gap:12px; align-items:center;">
          <!-- Localized Progress Bar -->
          <div class="header-progress-container" id="header-progress-container">
            <span class="header-progress-text" id="header-progress-text">Connecting to P2P swarm...</span>
            <div class="header-progress-bar-container">
              <div class="header-progress-bar" id="header-progress-bar"></div>
            </div>
          </div>

          <!-- Download Entire Gallery Button -->
          <button class="icon-btn" id="download-all-btn" title="Download entire gallery">
            <i class="fa-solid fa-file-zipper"></i>
          </button>
        </div>
      </div>

      <div class="gallery-grid" id="gallery-grid">
        <!-- Empty State before torrent loads -->
        <div class="empty-state" id="empty-state">
          <i class="fa-solid fa-network-wired"></i>
          <h3>Awaiting Torrent Feed</h3>
          <p>Please compile the galleries manifest by running <code>make build-gallery</code> locally.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close Lightbox"><i class="fa-solid fa-xmark"></i></button>
    <div class="lightbox-content">
      <img class="lightbox-media" id="lightbox-img" src="" alt="Lightbox image">
      <video class="lightbox-media" id="lightbox-video" controls autoplay></video>
    </div>
    <div class="lightbox-title" id="lightbox-title">File Name</div>
  </div>

  <!-- WebTorrent Library -->
  <script src="https://cdn.jsdelivr.net/npm/webtorrent@1/webtorrent.min.js"></script>
  <!-- JSZip (used to archive gallery into a ZIP for download) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="snapmatephoto-nimisha.js"></script>
</body>
</html>
